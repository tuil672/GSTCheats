name: Build GSTgeode

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GSTgeode
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Win64
          build-config: Release

      - name: Upload GSTgeode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSTgeode-Win64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
