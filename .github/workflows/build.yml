
name: Build GSTgeode

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GSTgeode
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Win64
          build-config: Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSTgeode-Win64
          path: build/**/*.geode
          if-no-files-found: error
